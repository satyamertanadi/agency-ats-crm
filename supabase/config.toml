project_id = "agency-ats-crm"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
secure_password_change = true

[storage]
enabled = true
file_size_limit = "25MiB"

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
enabled = true
port = 55327
backend = "postgres"

[edge_runtime]
policy = "per_worker"

[db.pooler]
enabled = false
port = 55329

[functions.send-invitation]
enabled = true
verify_jwt = false

[functions.send-submission]
enabled = true
verify_jwt = false

[functions.public-review]
enabled = true
verify_jwt = false

[functions.parse-linkedin-profile]
enabled = true
verify_jwt = false

[functions.calendar-auth-start]
enabled = true
verify_jwt = false

[functions.calendar-auth-callback]
enabled = true
verify_jwt = false

[functions.calendar-sync]
enabled = true
verify_jwt = false

[functions.calendar-disconnect]
enabled = true
verify_jwt = false

[functions.execute-import]
enabled = true
verify_jwt = false

[functions.parse-candidate-cv]
enabled = true
verify_jwt = false

# Called by pg_cron inside the project, not by a browser session: it authenticates with
# WORKER_SECRET or the service role key in its own handler rather than with a user JWT.
[functions.scheduled-maintenance]
enabled = true
verify_jwt = false

[functions.generate-candidate-profile]
enabled = true
verify_jwt = false

# Same shape as generate-candidate-profile: the handler calls requireUser() itself, and the browser's
# CORS preflight carries no Authorization header, so the gateway must not reject OPTIONS on its own.
[functions.draft-job-requirements]
enabled = true
verify_jwt = false

[functions.location-autocomplete]
enabled = true
verify_jwt = false
