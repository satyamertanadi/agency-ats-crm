name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: Deno 2.3+ writes lockfile v5, which the Supabase Edge Functions
          # runtime cannot read ("Failed reading lockfile") -- it only supports v4, produced by
          # 2.0-2.2.x. supabase/functions/deno.lock was generated with this exact version; bumping
          # it means regenerating that lockfile too, not just changing this line.
          deno-version: 2.2.0
      - name: Reject unpinned Edge Function imports
        run: |
          # supabase/functions/deno.json pins @supabase/supabase-js to one exact npm version via an
          # import map (see supabase/functions/deno.json + deno.lock) precisely so a floating
          # `https://esm.sh/...@2` specifier can never silently reach production again -- catch a
          # reintroduced one here rather than at the next cold start.
          if grep -rn "from 'https://" supabase/functions/ --include=*.ts; then
            echo "::error::Found an unpinned https:// import under supabase/functions -- pin it via supabase/functions/deno.json instead (see the reharden commit for the pattern)."
            exit 1
          fi
      - name: Type-check Edge Functions
        run: |
          cd supabase/functions
          # --frozen fails the build if deno.lock doesn't already cover the resolved dependency
          # graph exactly, rather than silently rewriting it -- a deployment must be reproducible
          # from what's committed, not from whatever the CI runner happened to resolve this time.
          deno check --frozen ai-evaluate/index.ts calendar-auth-callback/index.ts calendar-auth-start/index.ts calendar-disconnect/index.ts calendar-sync/index.ts execute-import/index.ts generate-candidate-profile/index.ts parse-candidate-cv/index.ts parse-linkedin-profile/index.ts public-review/index.ts refer/index.ts send-invitation/index.ts send-submission/index.ts
      - run: supabase start
      - run: supabase db reset
      - run: supabase db lint --level warning
      - name: Verify generated database types are current
        run: |
          supabase gen types typescript --local --schema public > src/generated/database.types.ts
          git diff --exit-code -- src/generated/database.types.ts
      - name: Run non-skipping RLS tests
        run: |
          export SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)
          export SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)
          export SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)
          npm run test:rls
      - name: Compile and smoke Edge Functions
        shell: bash
        run: |
          supabase functions serve --no-verify-jwt > /tmp/edge-functions.log 2>&1 &
          functions_pid=$!
          trap 'kill "$functions_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --request OPTIONS http://127.0.0.1:55321/functions/v1/ai-evaluate > /dev/null; then
              break
            fi
            sleep 2
          done
          SUPABASE_URL=http://127.0.0.1:55321 npm run test:functions
      - name: Print Edge Function logs on failure
        if: failure()
        run: cat /tmp/edge-functions.log || true

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
