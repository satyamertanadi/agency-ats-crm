name: Update e2e snapshots

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop --update-snapshots
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots-linux
          path: tests/e2e/**/*-snapshots/*.png
