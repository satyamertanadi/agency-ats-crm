name: Tested production promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-main
  cancel-in-progress: false

env:
  # 48.10.1 rejects this project's configured Node.js Version (24.x) with "Found invalid Node.js
  # Version" -- that CLI predates Vercel's Node 24 support. 56.2.1 is the first version confirmed to
  # build this project successfully (verified by hand: `vercel build --prod` completes clean).
  VERCEL_CLI_VERSION: 56.2.1
  # 2.75.0 pulls ghcr.io/supabase/edge-runtime:v1.70.0 to bundle functions, and that pairing has failed
  # `deploy-production-supabase` on its first function (whichever sorts first alphabetically, not
  # anything specific to it) with "Error: No such file or directory (os error 2)" / "error running container:
  # exit 1" on two consecutive production promotions (2026-07-26, 2026-07-27) -- both recovered on a
  # bare re-run, so it is a startup race in that CLI/runtime pairing, not a broken image or a bad
  # function. staging never hits it because `supabase functions deploy` reports "No change found" and
  # skips container bundling entirely when the bundle is unchanged, so only a production deploy that
  # actually has to bundle exercises the failing path. ci.yml and debug-rls.yml already run
  # `version: latest` without hitting this; pinning here (rather than floating) is for deploy
  # reproducibility, matching VERCEL_CLI_VERSION above. 2.110.0 is the newest tagged release as of this
  # pin -- not yet verified against a real production promotion, so watch the next deploy.
  SUPABASE_CLI_VERSION: 2.110.0

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-staging:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "${{ secrets.STAGING_PROJECT_REF }}"

  staging-gate:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Edge function preflight smoke
        run: npm run test:functions
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      - name: Real-provider parse, evidence, persistence, and finalization contract
        run: npm run test:staging
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

  deploy-production-supabase:
    # Production data changes wait until the exact frontend artifact has passed
    # its public browser contract. These migrations stay backwards-compatible
    # with the frontend currently serving the production alias.
    needs: browser-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"
      - name: Production edge smoke
        run: npm run test:functions
        env:
          SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      - name: Schedule in-project maintenance cron
        shell: bash
        # Registers the hourly retention/anonymization run with pg_cron INSIDE the client's Supabase
        # project. This step only (re)registers the schedule -- the runs themselves no longer depend
        # on GitHub, which is the whole point: a scheduled workflow here would be auto-disabled after
        # 60 days of repo inactivity and take the client's data-deletion guarantee down with it
        # silently. schedule_maintenance_cron is idempotent, so running it on every promotion is
        # exactly the intended usage; the secret is passed as an argument and never committed.
        run: |
          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "apikey: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}" \
            --header "authorization: Bearer ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}" \
            --header "content-type: application/json" \
            --data "{\"p_function_url\":\"${{ secrets.PRODUCTION_SUPABASE_URL }}/functions/v1/scheduled-maintenance\",\"p_worker_secret\":\"${{ secrets.CV_PARSE_WORKER_SECRET }}\"}" \
            "${{ secrets.PRODUCTION_SUPABASE_URL }}/rest/v1/rpc/schedule_maintenance_cron")"
          echo "schedule_maintenance_cron -> $response"
          # The function returns a diagnostic string instead of raising when pg_cron/pg_net are
          # missing, so a non-"scheduled" result is a real misconfiguration and must fail the deploy
          # rather than leave retention unscheduled behind a green pipeline.
          case "$response" in
            *scheduled*) ;;
            *) echo "::error::Maintenance cron was not scheduled: $response"; exit 1 ;;
          esac

  build-vercel-candidate:
    needs: staging-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull production project settings
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build one production artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - id: deploy
        name: Deploy candidate without production alias
        shell: bash
        # The artifact was built with `vercel build --prod`, so its embedded target is production;
        # newer CLI versions reject a deploy whose --prod flag doesn't match that (older 48.10.1
        # tolerated the mismatch and quietly treated it as unaliased). --skip-domain is what keeps
        # this deployment off the live domain despite --prod, per Vercel's own docs -- promote-production
        # aliases it explicitly later, once browser-gate has passed.
        run: |
          url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --skip-domain --token='${{ secrets.VERCEL_TOKEN }}')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Capture rollback metadata
        shell: bash
        run: |
          printf '{"commit":"%s","candidate":"%s","previousProduction":"%s"}\n' "$GITHUB_SHA" "${{ steps.deploy.outputs.url }}" "${{ secrets.PRODUCTION_APP_URL }}" > rollback-metadata.json
          npx --yes vercel@${VERCEL_CLI_VERSION} inspect "${{ secrets.PRODUCTION_APP_URL }}" --token='${{ secrets.VERCEL_TOKEN }}' >> rollback-metadata.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ github.sha }}
          path: rollback-metadata.json
          retention-days: 90

  browser-gate:
    needs: build-vercel-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop --grep-invert @authenticated
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.build-vercel-candidate.outputs.deployment_url }}
          # The candidate URL sits behind Vercel's own Deployment Protection (a login wall), which is
          # deliberate -- it's what stops the unreviewed build from being publicly viewable before this
          # gate approves it. This bypass secret is scoped to automation only; see playwright.config.ts.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  authenticated-browser-gate:
    needs: [build-vercel-candidate,deploy-production-supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Authenticated consultant golden path
        run: npm run test:e2e -- --project=desktop --grep @authenticated
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.build-vercel-candidate.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          RUN_AUTHENTICATED_GOLDEN_PATH: 'true'
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_E2E_CONSULTANT_EMAIL: ${{ secrets.PRODUCTION_E2E_CONSULTANT_EMAIL }}

  promote-production:
    needs: [build-vercel-candidate,browser-gate,deploy-production-supabase,authenticated-browser-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Promote the tested artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} promote "${{ needs.build-vercel-candidate.outputs.deployment_url }}" --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Post-promotion browser smoke
        run: npm run test:e2e -- --project=desktop --grep-invert @authenticated
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PRODUCTION_APP_URL }}
          # The live production domain isn't behind Deployment Protection today (confirmed: it serves
          # the app directly), but playwright.config.ts requires this whenever a remote URL is in play
          # so the check keeps working unattended if that ever changes.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
